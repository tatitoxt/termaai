[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "termaai"
version = "0.1.0"
description = "Terminal AI assistant that turns natural-language requests into Bash scripts and runs them behind a safety pipeline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fausto Pastura" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer==0.12.5",
    "click==8.1.7",
    "rich==13.9.4",
    "tomli==2.0.1; python_version < '3.11'",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.scripts]
termaai = "termaai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termaai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a working Docker daemon and the sandbox image",
    "e2e: drives the installed termaai CLI through a pseudo-terminal",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/termaai"]
